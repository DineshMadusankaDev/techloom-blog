<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechLoom Article Manager</title></head><body><h1>TechLoom Article Manager</h1><p>Write and prepare articles from your phone.</p><label>Title <input id="title"></label><br><label>Content <textarea id="content"></textarea></label><br><button onclick="saveDraft()">Save Draft</button><p id="status"></p><script>function saveDraft(){localStorage.setItem('techloomDraft',JSON.stringify({title:document.getElementById('title').value,content:document.getElementById('content').value}));document.getElementById('status').textContent='Draft saved on this phone.'}</script></body></html>
